device: auto            # auto | cpu | cuda | cuda:1 | mps
seed: 0
num_threads: 8           # torch/BLAS 线程数：0=全部逻辑核，N=指定 N，负数=不干预
                         # 注意：CPU 训练时调大有效；GPU 训练时收益有限（MCTS 树遍历是单线程 Python）

board:
  size: 15              # 棋盘边长：9 / 13 / 15 / 19 ...（网络、编码、回放池自动适配）

paths:
  models: models
  logs: logs

net:
  channels: 32
  blocks: 3

mcts:
  sims_play: 400
  sims_train: 150
  c_puct: 1.5
  root_noise: true
  dir_alpha: 0.3
  dir_eps: 0.05          # 根节点噪声权重：0.75*网络先验 + 0.05*噪声（越小越信网络）
  search_margin: 2       # 可落子范围：棋子外接矩形再外扩 N 圈；-1 表示全棋盘
  temp_moves: 15
  temp: 1.0

train:
  iterations: 50
  games_per_iter: 20
  batch_size: 128
  updates_per_iter: 50
  lr: 0.002
  weight_decay: 0.0001
  c_policy: 1.0
  lambda_vbar: 0.2
  replay_capacity: 200000
  eval_every: 100
  eval_games: 20
  save_every_iters: 5      # 每 5 轮额外保存 models/ckpt_000005.pt 这类快照；0 关闭
  keep_checkpoints: 5      # 只保留最近 5 个轮次快照（latest.pt 不受影响）
  # ---- 训练对手与评测 ----
  heuristic_warmup_iters: 50   # 前 N 轮用启发式 AI 陪练；N=0 表示全程自对弈
  opponent_sims: 32            # 训练对手每步搜索次数；0=不搜索（纯贪心），越大越强越慢
  eval_vs_heuristic_sims: 300  # 评测时启发式 MCTS 的搜索次数（对手强弱）
  # ---- 数据质量 ----
  opening_moves: 0             # 训练开局先用启发式走 K 手，跳过网络弱开局；0=不启用
  opening_max: 0               # K 的上限（随机取 [opening_moves, opening_max]）
  pi_min_visits: 0             # 策略标签只保留访问次数 >= N 的动作；0=不截断
  # 每局先手/后手各 50%，由训练循环内部随机决定，无需配置
